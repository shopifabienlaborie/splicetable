<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splicetable - Image Grid Splitter</title>
    <link rel="stylesheet" href="style.css?v=9">
    <link rel="stylesheet" href="lib/osmosis-ds.css">
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="lib/osmosis-ds.umd.js"></script>
    <script>
        var OsmosisDS = window.OsmosisDS;
        window.Button = OsmosisDS.Button;
        window.Control = OsmosisDS.Control;
        window.Divider = OsmosisDS.Divider;
        window.ImageReplacer = OsmosisDS.ImageReplacer;
        window.Knob = OsmosisDS.Knob;
        window.Navbar = OsmosisDS.Navbar;
        window.SectionTitle = OsmosisDS.SectionTitle;
        window.SegmentedControl = OsmosisDS.SegmentedControl;
        window.Select = OsmosisDS.Select;
        window.Slider = OsmosisDS.Slider;
        window.TextField = OsmosisDS.TextField;
    </script>
</head>
<body>
    <!-- Navbar with React components -->
    <div id="navbar-root"></div>
    
        <!-- Sidebar wrapper -->
    <div class="sidebar-wrapper">
        <div class="sidebar">
          <div class="sidebar-panels" id="sidebarPanels">
            <!-- Panel 1: Main controls -->
            <div class="sidebar-panel panel-1">
                <!-- Section 1: Canvas (Background) -->
                <div class="sidebar-section section-canvas" id="contentControls">
                    <div id="sectionTitle-canvas-root"></div>
                    <div class="section-content">
                        <!-- Control: Background — wraps ratio + bg type row + color/image content -->
                        <div id="backgroundControl-root"></div>
                    </div>
                </div>

                <!-- Divider -->
                <div id="divider1-root"></div>

                <!-- Section 2: Global (Material + Splicer + Knobs) -->
                <div class="sidebar-section section-global" id="globalControls">
                    <div id="sectionTitle-global-root"></div>
                    <div class="section-content section-content-wide">
                        <!-- Control: Splicer -->
                        <div id="splicerControl-root"></div>

                        <!-- Control: Material -->
                        <div id="materialControl-root"></div>

                        <!-- Knobs grid: Scale, Size, Spread, Tumble -->
                        <div id="globalKnobsGrid" class="knobs-grid cols-2">
                            <div id="canvasScale-root"></div>
                            <div id="sizeGroup"><div id="cellSize-root"></div></div>
                            <div id="spreadGroup"><div id="cellSpread-root"></div></div>
                            <div id="tumbleGroup"><div id="cellTumble-root"></div></div>
                        </div>
                    </div>
                </div>

                <!-- Divider -->
                <div id="divider2-root"></div>

                <!-- Section 3: Cells -->
                <div class="sidebar-section section-cells" id="cellControls">
                    <div id="sectionTitle-cells-root"></div>
                    <div class="section-content section-content-wide">
                        <!-- Control: Cell (Fill/Fit) - only for Image content -->
                        <div id="cellFitGroup" style="display: none;">
                            <div id="cellControl-root"></div>
                        </div>

                        <!-- Knobs grid: Count, Radius, Chaos -->
                        <div id="cellsKnobsGrid" class="knobs-grid cols-2">
                            <div id="cellCount-root"></div>
                            <div id="radiusGroup"><div id="cellRadius-root"></div></div>
                            <div id="chaosGroup" style="display: none;"><div id="chaos-root"></div></div>
                        </div>

                        <!-- Dimensions W/H/Lock - only for Scatter layout -->
                        <div id="dimensionsGroup" style="display: none;">
                            <div class="knobs-grid dimensions-grid">
                                <div id="cellWidth-root"></div>
                                <div id="lockAspectBtn-root" class="lock-btn-container"></div>
                                <div id="cellHeight-root"></div>
                            </div>
                            <p class="hint-text" id="scatterHint">Select one to edit individually</p>
                        </div>
                    </div>
                </div>

                <!-- Divider -->
                <div id="divider3-root"></div>

                <!-- Section 4: Export -->
                <div class="sidebar-section section-export" id="exportControls">
                    <div id="sectionTitle-export-root"></div>
                    <div class="section-content">
                        <div class="export-row">
                            <div class="export-scale-select" id="exportScale-root"></div>
                            <div id="exportBtn-root"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Panel 2: Cell detail -->
            <div class="sidebar-panel panel-2">
                <div class="sidebar-section">
                    <div id="cellDetail-sectionTitle-root"></div>
                    <div class="section-content section-content-wide">
                        <div class="knobs-grid dimensions-grid">
                            <div id="cellDetail-width-root"></div>
                            <div id="cellDetail-lock-root" class="lock-btn-container"></div>
                            <div id="cellDetail-height-root"></div>
                        </div>
                        <div id="cellDetail-visibility-root"></div>
                        <div id="cellDetail-resetOverride-root"></div>
                    </div>
                </div>
            </div>
          </div>
        </div>
    </div>

    <div id="gridContainer" class="grid-container">
        <!-- Hidden test hook: toggles crosshair visibility for automation testing -->
        <button id="testToggleCrosshairs"
                aria-label="Toggle Crosshairs"
                style="position:fixed;top:0;left:50%;width:20px;height:20px;z-index:99999;opacity:0.01;cursor:default;border:0;padding:0;background:transparent;"
                onclick="document.getElementById('gridContainer').classList.toggle('show-crosshairs');">
        </button>
        <div class="home-screen" id="homeScreen">
            <p class="home-title">SPLICETABLE</p>
            
            <div class="home-center">
                <div id="upload-button-root"></div>
                <p class="home-subtitle">Or pick a floating starter</p>
            </div>
            
            <p class="home-footer">Created by Fabien Laborie</p>

            <!-- Hidden test hook: loads example image (accessible for automation) -->
            <button id="testLoadExample"
                    aria-label="Load Example Image"
                    style="position:fixed;top:0;right:0;width:20px;height:20px;z-index:99999;opacity:0.01;cursor:default;border:0;padding:0;background:transparent;"
                    onclick="if(window.appInstance){window.appInstance.loadExampleImage({target:{dataset:{image:'Examples/deer.jpg'}}});}">
            </button>

            <!-- Floating images container -->
            <div class="floating-images-container">
                <div class="floating-image" data-image="Examples/deer.jpg" style="left: 50px; top: 40px; width: 178px; height: 240px;">
                    <img src="Examples/thumbs/deer.jpg" alt="Deer">
                </div>
                <div class="floating-image" data-image="Examples/fashionportrait.jpg" style="left: -60px; top: 400px; width: 192px; height: 240px;">
                    <img src="Examples/thumbs/fashionportrait.jpg" alt="Fashion portrait">
                </div>
                <div class="floating-image" data-image="Examples/pointillism.jpg" style="left: 180px; top: 640px; width: 200px; height: 200px;">
                    <img src="Examples/thumbs/pointillism.jpg" alt="Pointillism">
                </div>
                <div class="floating-image" data-image="Examples/plastictoycar.png" style="left: 400px; top: -30px; width: 200px; height: 200px;">
                    <img src="Examples/thumbs/plastictoycar.jpg" alt="Plastic toy car">
                </div>
                <div class="floating-image" data-image="Examples/van.png" style="left: 520px; top: 680px; width: 180px; height: 180px;">
                    <img src="Examples/thumbs/van.jpg" alt="Van">
                </div>
                <div class="floating-image" data-image="Examples/skull.jpg" style="left: 870px; top: -40px; width: 200px; height: 200px;">
                    <img src="Examples/thumbs/skull.jpg" alt="Skull">
                </div>
                <div class="floating-image" data-image="Examples/doggo.jpeg" style="left: 1050px; top: 480px; width: 240px; height: 161px;">
                    <img src="Examples/thumbs/doggo.jpg" alt="Dog">
                </div>
                <div class="floating-image" data-image="Examples/plasticportrait.jpg" style="left: 1220px; top: 80px; width: 156px; height: 240px;">
                    <img src="Examples/thumbs/plasticportrait.jpg" alt="Plastic portrait">
                </div>
                <div class="floating-image" data-image="Examples/radiantportrait.jpg" style="left: 1200px; top: 620px; width: 156px; height: 240px;">
                    <img src="Examples/thumbs/radiantportrait.jpg" alt="Radiant portrait">
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden file input for image upload -->
    <input type="file" id="imageUpload" accept="image/*" style="display: none;">

    <!-- Initialize Navbar and Sidebar Components -->
    <script src="app-ui.js?v=1"></script>
    
    <!-- Hidden file input for home screen upload -->
    <input type="file" id="imageUploadCenter" accept="image/*" style="display: none;">

    <script src="script.js?v=5"></script>
</body>
</html>
